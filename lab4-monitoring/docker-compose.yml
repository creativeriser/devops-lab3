
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: lab4-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: lab4-grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
