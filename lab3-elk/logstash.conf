input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devops-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}